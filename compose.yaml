# AREFIL deployment: HTTPS edge -> Next.js -> FastAPI -> SQLite.
#
# Default edge: Caddy (this file alone), the only service publishing ports.
# Cloudflare Tunnel edge: add compose.cloudflare.yaml (COMPOSE_FILE in .env);
# Caddy is then not started and only the frontend listens, on loopback, for
# the host's cloudflared. Either way the backend has no host port at all and
# the browser reaches it only through /backend-api. Local development over
# HTTP is `make compose_up`.

# Fixed so that a checkout in another directory never starts a second stack
# on the same data directory. COMPOSE_PROJECT_NAME still overrides it.
name: arefil

services:
  backend:
    build:
      context: ../Arefil_backend
      dockerfile: Dockerfile
      args:
        APP_UID: ${AREFIL_UID:-1000}
        APP_GID: ${AREFIL_GID:-1000}
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/data/arefil.db
      UPLOADS_DIR: /app/data/uploads
      BACKUPS_DIR: /app/data/backups
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REPORT_EXECUTION_CLEANUP_ENABLED: ${REPORT_EXECUTION_CLEANUP_ENABLED:-true}
      REPORT_EXECUTION_CLEANUP_INTERVAL_SECONDS: ${REPORT_EXECUTION_CLEANUP_INTERVAL_SECONDS:-3600}
      REPORT_EXECUTION_CLEANUP_BATCH_SIZE: ${REPORT_EXECUTION_CLEANUP_BATCH_SIZE:-500}
      REPORT_EXECUTION_CLEANUP_MAX_RECORDS: ${REPORT_EXECUTION_CLEANUP_MAX_RECORDS:-5000}
      SESSION_COOKIE_SECURE: "true"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      CORS_ORIGINS: '["${AREFIL_PUBLIC_ORIGIN:-https://localhost}"]'
      TRUSTED_ORIGINS: '["${AREFIL_PUBLIC_ORIGIN:-https://localhost}"]'
      # Only the frontend's fixed private address may report the browser's address
      # (not the whole subnet: the Docker host's gateway address lives there too).
      TRUSTED_PROXIES: '["${AREFIL_FRONTEND_INTERNAL_IP:-172.31.240.10}/32"]'
      # true only for the very first start of a new installation (app/db/guard.py).
      AREFIL_ALLOW_NEW_DATABASE: ${AREFIL_ALLOW_NEW_DATABASE:-false}
    volumes:
      - type: bind
        source: ${BACKEND_DATA_DIR:-../Arefil_backend/backend/data}
        target: /app/data
        bind:
          create_host_path: false
    expose:
      - "8000"
    networks:
      - internal
    restart: unless-stopped
    stop_grace_period: 15s

  report-execution-cleanup:
    build:
      context: ../Arefil_backend
      dockerfile: Dockerfile
      args:
        APP_UID: ${AREFIL_UID:-1000}
        APP_GID: ${AREFIL_GID:-1000}
    command: ["python", "-m", "app.cli.report_executions", "worker"]
    # The image's healthcheck probes the backend's HTTP port, which this worker
    # does not serve (always "unhealthy", failing `up --wait`), and Compose also
    # fails `--wait` on a service without one. Liveness of the worker (PID 1).
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/data/arefil.db
      UPLOADS_DIR: /app/data/uploads
      BACKUPS_DIR: /app/data/backups
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS: '["${AREFIL_PUBLIC_ORIGIN:-https://localhost}"]'
      TRUSTED_ORIGINS: '["${AREFIL_PUBLIC_ORIGIN:-https://localhost}"]'
      REPORT_EXECUTION_CLEANUP_ENABLED: ${REPORT_EXECUTION_CLEANUP_ENABLED:-true}
      REPORT_EXECUTION_CLEANUP_INTERVAL_SECONDS: ${REPORT_EXECUTION_CLEANUP_INTERVAL_SECONDS:-3600}
      REPORT_EXECUTION_CLEANUP_BATCH_SIZE: ${REPORT_EXECUTION_CLEANUP_BATCH_SIZE:-500}
      REPORT_EXECUTION_CLEANUP_MAX_RECORDS: ${REPORT_EXECUTION_CLEANUP_MAX_RECORDS:-5000}
    volumes:
      - type: bind
        source: ${BACKEND_DATA_DIR:-../Arefil_backend/backend/data}
        target: /app/data
        bind:
          create_host_path: false
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /backend-api
    environment:
      API_INTERNAL_URL: http://backend:8000/api
      # Caddy is the only way in and overwrites X-Forwarded-For.
      TRUST_PROXY_FORWARDED_FOR: "true"
    expose:
      - "3000"
    networks:
      internal:
        ipv4_address: ${AREFIL_FRONTEND_INTERNAL_IP:-172.31.240.10}
      edge: {}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  caddy:
    image: caddy:2-alpine
    environment:
      AREFIL_HOSTNAME: ${AREFIL_HOSTNAME:-localhost}
      AREFIL_TLS: ${AREFIL_TLS:-internal}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

networks:
  # Frontend <-> backend only; no route to the outside world.
  internal:
    internal: true
    ipam:
      config:
        - subnet: ${AREFIL_INTERNAL_SUBNET:-172.31.240.0/24}
  # Caddy <-> frontend.
  edge: {}

volumes:
  # Caddy's certificates (including its internal CA when AREFIL_TLS=internal).
  caddy_data: {}
  caddy_config: {}
